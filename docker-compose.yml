# PostgreSQL for Bulltrack Pro challenge
# Run: docker compose -f docker-compose.bulltrack.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: bulltrack-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bulltrack
    ports:
      - "5432:5432"
    volumes:
      - bulltrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bulltrack_pgdata:
